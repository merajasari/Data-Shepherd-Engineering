<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — Data Shepherd Engineering</title>
<style>
:root{--bg:#07101f;--text:#f4f8fb;--muted:#9eb2c3;--accent:#20d6c7;--border:rgba(125,188,224,.20);--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(180deg,#07111b,#0b1825);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(560px,100%);padding:30px;border:1px solid var(--border);border-radius:24px;background:linear-gradient(180deg,rgba(17,40,59,.98),rgba(9,24,37,.98));box-shadow:0 24px 60px rgba(0,0,0,.3)}.eyebrow{color:#36d8ff;font-size:.75rem;font-weight:900;letter-spacing:.16em}h1{margin:8px 0 10px}.muted{color:var(--muted);line-height:1.6}.field{display:grid;gap:8px;margin-top:16px}.field label{font-weight:800}.field input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:#071520;color:var(--text);font-size:1rem}.error{margin-top:15px;padding:12px;border-radius:12px;border:1px solid rgba(255,139,139,.35);background:rgba(255,139,139,.08);color:#ffc4c4}.submit{width:100%;margin-top:19px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--accent),#8ce6ff);color:#04201e;font-weight:900;cursor:pointer}</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">DATA SHEPHERD ENGINEERING</div>
  <h1>Choose your permanent password</h1>
  <p class="muted">Your assigned temporary password must be replaced before dashboard access is enabled. Use at least 12 characters with upper-case, lower-case, and numeric characters.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('change_member_password') }}">
    <div class="field"><label for="current_password">Temporary password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required></div>
    <div class="field"><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></div>
    <button class="submit" type="submit">SAVE PASSWORD & OPEN DASHBOARD</button>
  </form>
</div>
</body>
</html>
